# Static site: no build step, everything is served from the repo root.
[build]
  publish = "."
  command = ""

# Reels, posters and the font never change without a new filename,
# so they can be cached hard. The HTML must not be.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ...but the network page's code and data are NOT content-addressed -- app.js
# is always app.js, and a portrait is named by the player's index, which shifts
# whenever the roster changes. Cached immutable, a fix would never reach anyone
# who had already visited. They revalidate instead: unchanged files come back
# 304 with no body, so it costs a header round trip and nothing else.
[[headers]]
  for = "/assets/net/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ...and the same for the football network, for the same reason. Both pages do
# also carry ?v= on every asset URL, but that only helps if someone remembers
# to bump ASSET_V -- forgetting is precisely what pinned a year-old app.js on
# every returning phone in August 2026, and a stored immutable entry is never
# revalidated, so no header change can reach it afterwards. Two defences.
[[headers]]
  for = "/assets/foot/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The network data is gzipped on disk. Saying so lets the browser inflate it
# itself, which matters on iOS: every browser there is WebKit, and WebKit only
# got DecompressionStream in Safari 16.4 -- anything older cannot unpack these
# in script and used to sit on the loading line for ever.
[[headers]]
  for = "/assets/net/*.gz"
  [headers.values]
    Content-Encoding = "gzip"

[[headers]]
  for = "/assets/foot/*.gz"
  [headers.values]
    Content-Encoding = "gzip"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# the two network pages are HTML too, and must not be cached hard either
[[headers]]
  for = "/network.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/football.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
