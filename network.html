<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The NFL teammate network — Sportalytic</title>
<meta name="description" content="Every NFL player since 1920, linked by shared team-seasons. Click anyone to see their path to the centre, or make them the centre.">
<link rel="icon" href="assets/logo.png">
<style>
@font-face{font-family:"Archivo Black";src:url("assets/ArchivoBlack.woff2") format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#0B1117;--panel:#141C25;--ink:#FFFFFF;--amber:#FBC247;--blue:#4E7FA8;
  --grey:#6C7A88;--greyd:#39454F;--maxw:1240px;
  --display:"Archivo Black","Arial Black",Arial,sans-serif;
  --body:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden}
a{color:inherit}
header{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(11,17,23,.8);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07)}
.bar{max-width:var(--maxw);margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:20px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:26px;height:26px}
.brand span{font-family:var(--display);font-size:15px;text-transform:uppercase}
nav{display:flex;gap:18px;margin-right:auto}
nav a{text-decoration:none;font-size:12px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--grey);padding:4px 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink);border-bottom-color:var(--amber)}
.cta{background:var(--amber);color:#0B1117;text-decoration:none;font-weight:bold;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;padding:9px 15px;border-radius:8px;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
#stage{position:fixed;inset:60px 0 0 0}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:12px;left:12px;right:330px;display:flex;gap:8px;align-items:center}
.hud .spacer{flex:1}
.hud input,.hud select{background:var(--panel);color:var(--ink);border:1px solid var(--greyd);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px}
.hud optgroup{background:#0B1117;color:var(--amber);font-style:normal;font-weight:bold}
.hud optgroup option{color:var(--ink);font-weight:normal}
.hud input{width:200px;flex:0 0 auto}
#club{flex:0 1 300px;min-width:0}
#season{flex:0 0 auto;min-width:120px}
#results{position:absolute;top:56px;left:12px;background:var(--panel);border:1px solid var(--greyd);border-radius:10px;max-height:46vh;overflow:auto;min-width:260px;z-index:5}
#results div{padding:8px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05)}
#results div:hover{background:#1d2833}
#panel{position:absolute;right:12px;top:12px;width:296px;background:var(--panel);border:1px solid var(--greyd);border-radius:12px;padding:16px;font-size:14px}
#panel h2{font-family:var(--display);font-size:19px;margin:0 0 2px;text-transform:uppercase;line-height:1.1}
#panel .meta{color:var(--grey);font-size:13px;margin-bottom:12px}
#panel .deg{color:var(--amber);font-weight:bold}
.chain{margin:10px 0 0;list-style:none;max-height:34vh;overflow:auto}
.shareBox{margin:9px 0 2px;padding:9px 10px;background:#1d2833;border-left:3px solid #F38A1C;
  border-radius:6px;font-size:12px;line-height:1.5}
.shareBox b{color:#F38A1C;font-size:17px}
.note{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.09);
  color:#9CC2DC;font-size:11px;line-height:1.5}
.note b{color:#F38A1C;font-size:12px}
.muted2{color:var(--grey);display:block;margin-top:5px;font-size:10px}
.btn{display:inline-block;margin-top:12px;background:var(--amber);color:#0B1117;border:0;border-radius:8px;padding:9px 13px;font:inherit;font-weight:bold;font-size:13px;cursor:pointer;width:100%}
/* an undo sits beside a primary action, so it reads quieter than one */
.btn.ghost{background:transparent;color:var(--amber);border:1px solid rgba(251,194,71,.45);margin-top:8px}
.btn.ghost:hover{background:rgba(251,194,71,.1)}
#tools{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;align-items:stretch;
  background:rgba(11,17,23,.72);backdrop-filter:blur(10px);padding:8px;border-radius:12px;
  border:1px solid rgba(255,255,255,.10)}
.tbtn{background:var(--panel);color:var(--ink);border:1px solid #4a5866;border-radius:9px;
  padding:11px 15px;font:inherit;font-size:14px;font-weight:bold;cursor:pointer;min-width:48px;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tbtn:hover{border-color:var(--amber);color:var(--amber);background:#1d2833}
.tbtn.on{background:var(--amber);color:#0B1117;border-color:var(--amber)}
.tbtn.zoom{font-size:19px;line-height:1;padding:9px 15px}
.chain{position:relative;padding-left:18px}
.chain::before{content:'';position:absolute;left:5px;top:9px;bottom:9px;width:2px;background:var(--greyd)}
.node{position:relative;padding:2px 0;font-size:13px}
.node .dot{position:absolute;left:-17px;top:7px;width:9px;height:9px;border-radius:50%;
  background:var(--grey);border:2px solid var(--panel)}
.node.end .dot{background:var(--amber)}
.via{position:relative;color:var(--grey);font-size:11px;padding:1px 0 1px 0;display:flex;
  align-items:center;gap:5px}
.via::before{content:'';position:absolute;left:-13px;top:50%;width:9px;height:2px;background:var(--greyd)}
.chip{display:inline-block;background:#1d2833;border:1px solid var(--greyd);border-radius:4px;
  padding:1px 5px;font-size:10px;letter-spacing:.04em;color:#9CC2DC;font-weight:bold}
#stats{position:absolute;left:12px;bottom:12px;color:var(--grey);font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}
/* Test your knowledge. Sits where the player panel does, and takes over from
   it while a round is running. */
#quiz{position:absolute;right:12px;top:12px;width:296px;background:var(--panel);
  border:1px solid var(--greyd);border-radius:12px;padding:16px;font-size:14px;z-index:6}
#quiz h2{font-family:var(--display);font-size:17px;margin:0 0 10px;text-transform:uppercase}
#quiz .lead{color:var(--grey);font-size:12px;line-height:1.5;margin-bottom:12px}
.slot{display:flex;gap:6px;align-items:center;margin-bottom:7px}
.slot input{flex:1;min-width:0;background:#0B1117;color:var(--ink);border:1px solid var(--greyd);
  border-radius:7px;padding:8px 9px;font:inherit;font-size:13px}
.slot button{background:#1d2833;color:var(--amber);border:1px solid var(--greyd);border-radius:7px;
  padding:8px 9px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.slot button:hover{border-color:var(--amber)}
.slot .tag{font-size:10px;color:var(--grey);width:16px;text-align:center;font-weight:bold}
#quizRes{background:#0B1117;border:1px solid var(--greyd);border-radius:9px;
  max-height:190px;overflow:auto;margin-top:6px}
#quizRes div{padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05)}
#quizRes div:hover{background:#1d2833}
.qchain{list-style:none;margin:10px 0;padding-left:16px;position:relative;max-height:30vh;overflow:auto}
.qchain::before{content:'';position:absolute;left:4px;top:8px;bottom:8px;width:2px;background:var(--greyd)}
.qstep{position:relative;padding:3px 0;font-size:13px}
.qstep .dot{position:absolute;left:-15px;top:8px;width:8px;height:8px;border-radius:50%;
  background:var(--grey);border:2px solid var(--panel)}
.qstep.fix .dot{background:var(--amber)}
.qstep .via{color:var(--grey);font-size:11px}
/* the box you type into lives in the chain, in the gap it is there to close */
.qstep.gap{padding:6px 0 6px 0}
.qstep.gap input{width:100%;background:#0B1117;color:var(--ink);border:1px solid var(--amber);
  border-radius:7px;padding:8px 9px;font:inherit;font-size:13px}
.qstep.gap::before{content:'';position:absolute;left:-11px;top:0;bottom:0;width:2px;
  background:repeating-linear-gradient(180deg,var(--amber) 0 3px,transparent 3px 7px)}
.qclue{margin-top:6px;padding:7px 9px;background:#1d2833;border-left:3px solid var(--blue);
  border-radius:6px;color:#9CC2DC;font-size:11.5px;line-height:1.45}
.qclue b{color:var(--ink)}
.qerr{color:#F38A1C;font-size:12px;line-height:1.45;margin:8px 0 0}
.qdone{margin:10px 0 0;padding:9px 10px;background:#1d2833;border-left:3px solid var(--amber);
  border-radius:6px;font-size:12px;line-height:1.5}
.qdone b{color:var(--amber);font-size:16px}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--grey);font-size:15px}
@media(max-width:820px){
  #panel{right:8px;left:8px;top:auto;bottom:8px;width:auto}
  .hud{right:8px;flex-wrap:wrap}
  .hud input{width:auto;flex:1 1 100%}
  .hud .spacer{display:none}
}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="index.html"><img src="assets/logo.png" alt=""><span>Sportalytic</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#/reels">Our work</a>
  </nav>
  <a class="cta" href="index.html#contact">Get in touch</a>
</div></header>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="loading">Loading the network…</div>
  <div class="hud">
    <input id="q" placeholder="Search a player…" autocomplete="off">
    <select id="club"><option value="">Any club</option></select>
    <span class="spacer"></span>
    <select id="season"><option value="">Any season</option></select>
  </div>
  <div id="results" hidden></div>
  <div id="tools">
    <button class="tbtn" id="quizBtn" title="Link two players yourself, in as few steps as possible">Test your knowledge</button>
    <button class="tbtn" id="ring" title="Show only the players who shared a squad with the centre, grouped by club">Direct teammates</button>
    <button class="tbtn zoom" id="zin" title="Zoom in">+</button>
    <button class="tbtn zoom" id="zout" title="Zoom out">&minus;</button>
    <button class="tbtn" id="zfit" title="Fit to screen">Fit</button>
  </div>
  <div id="panel" hidden></div>
  <div id="quiz" hidden></div>
  <div id="stats"></div>
</div>

<script src="assets/net/app.js"></script>
<script src="assets/net/view.js"></script>
<script>
const $=s=>document.querySelector(s);
let CENTRE=0;

function renderPanel(i){
  const d=NET.info(i), p=NET.pathToCentre(i);
  const c=NET.info(CENTRE);
  $('#panel').hidden=false;
  $('#panel').innerHTML=
    `<h2>${d.name}</h2>
     <div class="meta">${d.position||'—'} · ${d.first}–${d.last}</div>
     ${i===CENTRE?`<div class="deg">This is the centre</div>`
       :`<div><span class="deg">${d.degree}°</span> from ${c.name}</div>
          <div class="chain">${p.map((n,k)=>{
            let row=`<div class="node ${k===p.length-1?'end':''}"><span class="dot"></span>${NET.names[n]}</div>`;
            if(k<p.length-1){
              // the link itself: which club and year actually joins these two
              const sh=NET.sharedTeamSeasons(n,p[k+1]);
              if(sh.length){
                const f=sh[0], more=sh.length>1?` +${sh.length-1}`:'';
                const full=sh.map(x=>`${x.team} ${x.season}`).join(', ');
                const nm=(NET.tables.teamMeta[f.team]||{}).name||f.team;
                row+=`<div class="via" title="${nm} — ${full}"><span class="chip">${f.team}</span> ${f.season}${more}</div>`;
              }
            }
            return row;}).join('')}</div>`}
     <button class="btn" id="share">Share of connections</button>
     <div id="shareOut"></div>
     <button class="btn" id="rec">Centre chart on ${d.name}</button>`;
  $('#rec').onclick=()=>recentre(i);
  $('#share').onclick=()=>{
    const r=NET.shareThrough(i);
    VIEW.setThrough(r.count?r.mask:null);
    // nobody routes through a player with nothing behind them: leave the chart
    // exactly as it is rather than spinning it for a 0% answer
    if(r.count){
      VIEW.captureFrom();
      NET.shareLayout(i, r.mask);
      VIEW.beginMorph(850);
    }
    const other=r.count-r.exclusive;
    if(!r.count){
      $('#shareOut').innerHTML=
        `<div class="shareBox"><b>0%</b> of the network reaches
          ${NET.names[CENTRE]} through ${d.name}. Every route to him is at least
          as short without ${d.name} — nobody sits behind him.</div>
         <button class="btn ghost" id="unshare">Back to the full chart</button>`;
      $('#share').hidden=true;
      $('#unshare').onclick=clearShare;
      return;
    }
    $('#shareOut').innerHTML=
      `<div class="shareBox"><b>${r.pct.toFixed(1)}%</b> of the network
        (${r.count.toLocaleString()} of ${r.total.toLocaleString()}) reaches
        ${NET.names[CENTRE]} by a shortest route through ${d.name}.
        <div class="note">But a shortest route is rarely the only one.
        ${other.toLocaleString()} of them have an equally short route that avoids
        ${d.name} entirely — only <b>${r.exclusive.toLocaleString()}</b>
        (${r.exclusivePct.toFixed(1)}%) actually get further away without him.
        That is why these dots also belong to other players, and why they move
        when you ask a different one.</div>
        ${DEBUG?`<span class="muted2">two extra passes, ${r.ms.toFixed(0)} ms</span>`:''}</div>
       <button class="btn ghost" id="unshare">Back to the full chart</button>`;
    $('#share').hidden=true;
    $('#unshare').onclick=clearShare;
  };
  if(VIEW.hasThrough){            // leaving a share view: put the layout back
    VIEW.captureFrom(); NET.recentre(CENTRE); VIEW.beginMorph(700);
  }
  if(DEBUG) document.body.dataset.dbg=JSON.stringify({sel:i,face:!!VIEW.faceFor(i),flags:VIEW.faceFlagCount});
  VIEW.setThrough(null);
  // swing the chart so this player's chain runs down the screen, where
  // horizontal labels have the most room not to collide
  if(i!==CENTRE && !VIEW.ringMode){
    VIEW.captureFrom();
    // only swings when the chain is within ~30 degrees of horizontal
    if(NET.rotateSo(i)) VIEW.beginMorph(650);
  }
  VIEW.selected=i; VIEW.path=i===CENTRE?[]:p;
}

/* Undo a share view: drop the highlight and slide everyone back to where the
 * normal layout puts them. Selecting anyone else does this too, but you should
 * not have to pick a different player just to get the chart back. */
function clearShare(){
  if(VIEW.hasThrough){
    VIEW.captureFrom(); NET.recentre(CENTRE); VIEW.beginMorph(700);
  }
  VIEW.setThrough(null);
  $('#shareOut').innerHTML='';
  const b=$('#share'); if(b) b.hidden=false;
}

const FACES={};   // player id -> portrait; only Kelce for now
function applyCentreImage(){ VIEW.setCentreImage(FACES[CENTRE]||null); }

function recentre(i){
  recentreQuiet(i);
  renderPanel(i);
}

/* Recentre without opening the player panel. The quiz hangs its round off
   player A and wants the chart to move, but not a card about him on top of the
   round. */
function recentreQuiet(i){
  VIEW.captureFrom();
  const r=NET.recentre(i);
  CENTRE=i; VIEW.centre=i; VIEW.path=[]; VIEW.selected=i;
  setRing(false);
  VIEW.beginMorph(950);
  applyCentreImage();
  stats(r);
}

/* First-ring view: the centre's direct teammates, grouped into a wedge per
 * club. Toggling back off just recomputes the full layout. */
function setRing(on){
  const btn=document.getElementById('ring');
  if(on){
    // a path highlight makes no sense once only the first ring is shown
    VIEW.path=[]; VIEW.selected=-1; VIEW.setThrough(null);
    $('#panel').hidden=true; $('#results').hidden=true;
    VIEW.captureFrom();
    const segs=NET.ringLayout(CENTRE);
    VIEW.setRingSegments(segs);
    VIEW.beginMorph(800);
    btn.classList.add('on');
  }else{
    if(!VIEW.ringMode){ btn.classList.remove('on'); return; }
    VIEW.captureFrom();
    NET.recentre(CENTRE);
    VIEW.setRingSegments(null);
    VIEW.beginMorph(800);
    btn.classList.remove('on');
  }
}

// ?debug in the URL brings back the timing readout used while building this
const DEBUG=location.search.indexOf('debug')>=0;
function stats(r){
  $('#stats').innerHTML=
    `${NET.P.toLocaleString()} players · centred on ${NET.names[CENTRE]} · `+
    `${r.ecc} degrees deep`+
    (DEBUG?`<br>recentre ${(r.bfsMs+r.layoutMs).toFixed(1)} ms `+
      `(bfs ${r.bfsMs.toFixed(1)} + layout ${r.layoutMs.toFixed(1)}) · `+
      `<span id="fps"></span>`:'');
}

(async()=>{
  const meta=await NET.load('assets/net');
  await VIEW.loadLogoIndex('assets/net');
  await VIEW.loadFaceFlags('assets/net');
  $('#loading').remove();
  const t=NET.tables;
  const club=$('#club'), season=$('#season');
  // A code that covers more than one franchise (BAL is the Colts then the
  // Ravens) is offered once per era rather than as one misleading entry.
  // clubs still playing first, then everything that has folded or moved on
  const clubOpts=[];
  t.teams.forEach(code=>{
    const m=t.teamMeta[code]||{};
    const rows=m.eras?m.eras.map(e=>({name:e.name,from:e.from,to:e.to,
                                      players:e.players,value:`${code}:${e.from}:${e.to}`}))
                    :[{name:m.name||code,from:m.from,to:m.to,players:m.players,value:code}];
    rows.forEach(r=>clubOpts.push({
      label:`${r.name} (${code}, ${r.from}\u2013${r.to}) — ${r.players||0} players`,
      value:r.value, sort:r.name, current:r.to>=t.seasonMax}));
  });
  clubOpts.sort((a,b)=>a.sort.localeCompare(b.sort));
  for(const [label,want] of [['Current clubs',true],['Historic clubs',false]]){
    const rows=clubOpts.filter(o=>o.current===want);
    if(!rows.length) continue;
    const g=document.createElement('optgroup'); g.label=`${label} (${rows.length})`;
    rows.forEach(o=>g.appendChild(new Option(o.label,o.value)));
    club.appendChild(g);
  }
  function fillSeasons(clubVal){
    const keep=season.value;
    season.length=1;                       // keep "Any season"
    let years=null;
    if(clubVal){
      const [code,lo,hi]=clubVal.split(':');
      const m=t.teamMeta[code];
      if(m&&m.seasons){
        years=m.seasons.filter(y=>!lo||(y>=+lo&&y<=+hi));
      }
    }
    if(!years) years=Array.from({length:t.seasonMax-t.seasonMin+1},(_,k)=>t.seasonMax-k);
    else years=years.slice().sort((a,b)=>b-a);
    years.forEach(y=>season.add(new Option(y,y)));
    // hold the chosen year if the new club also played it
    season.value=years.includes(+keep)?keep:'';
  }
  fillSeasons('');

  CENTRE=(t.notable&&t.notable['Travis Kelce'])||0;
  const r=NET.recentre(CENTRE);
  VIEW.init($('#cv'), i=>renderPanel(i));
  FACES[CENTRE]='assets/net/face-kelce.png';   // the only portrait we have so far
  VIEW.centre=CENTRE; VIEW.fit(); VIEW.buildGrid(); VIEW.tick();
  applyCentreImage();
  stats(r);
  console.log('load',meta.ms.toFixed(0)+'ms', 'recentre',(r.bfsMs+r.layoutMs).toFixed(1)+'ms');

  // ---- search + club/season filter ----
  const lower=NET.names.map(s=>s.toLowerCase());
  function rosterOf(team,yr){
    const set=new Set();
    let lo=-Infinity, hi=Infinity;
    if(team && team.indexOf(':')>0){                  // "CODE:from:to" era pick
      const p=team.split(':'); team=p[0]; lo=+p[1]; hi=+p[2];
    }
    for(let ts=0;ts<NET.tsSeason.length;ts++){
      if(team && t.teams[NET.tsTeam[ts]]!==team) continue;
      if(NET.tsSeason[ts]<lo || NET.tsSeason[ts]>hi) continue;
      if(yr && NET.tsSeason[ts]!==+yr) continue;
      for(let j=NET.t_ip[ts];j<NET.t_ip[ts+1];j++) set.add(NET.t_ix[j]);
    }
    return set;
  }
  function search(){
    const q=$('#q').value.trim().toLowerCase();
    const team=club.value, yr=season.value;
    if(!q && !team && !yr){ $('#results').hidden=true; return; }
    const pool=(team||yr)?rosterOf(team,yr):null;
    const out=[];
    for(let i=0;i<NET.P && out.length<60;i++){
      if(pool && !pool.has(i)) continue;
      if(q && lower[i].indexOf(q)<0) continue;
      out.push(i);
    }
    $('#results').hidden=false;
    $('#results').innerHTML=out.length?out.map(i=>
      `<div data-i="${i}">${NET.names[i]} <span style="color:var(--grey)">${NET.firstSeason[i]}–${NET.lastSeason[i]}</span></div>`
    ).join(''):'<div style="color:var(--grey)">No players match</div>';
  }
  /* ---------------------------------------------------------- the quiz ----
   * Two players; join them yourself in as few steps as you can. Every step you
   * add is checked against the real record -- two players are only linked if
   * they were on the same squad in the same season -- so the chain you build
   * is a claim the data either supports or does not.
   *
   * The answer is worked out up front with NET.route, which does not disturb
   * the chart: recentring on one of the two would give the other's degree away
   * just by which ring it landed in. */
  const QUIZ={on:false,a:-1,b:-1,chain:[],best:null,done:false,revealed:false,
            clue:null,clueLevel:0};

  // Random players are drawn from those with a portrait. That set is the
  // modern and the famous, which is the difference between a game and an
  // exercise in naming punters from 1961.
  let pickable=null;
  function pickablePool(){
    if(!pickable){
      pickable=[];
      // A portrait means modern or famous; four seasons means someone you have
      // plausibly heard of rather than a name off a 2025 practice squad.
      for(let i=0;i<NET.P;i++)
        if(VIEW.hasPortrait(i) && NET.lastSeason[i]-NET.firstSeason[i]>=3) pickable.push(i);
      if(pickable.length<50) pickable=Array.from({length:NET.P},(_,i)=>i);
    }
    return pickable;
  }
  function randomPlayer(){
    const p=pickablePool();
    return p[Math.floor(Math.random()*p.length)];
  }
  function findByName(s){
    // the boxes show "Name (1996-2008)", so drop a trailing span before looking
    s=s.replace(/\s*\((?:\d{4})\s*[–-]\s*(?:\d{4})\)\s*$/,'').trim().toLowerCase();
    if(!s) return -1;
    let exact=-1, part=-1;
    for(let i=0;i<NET.P;i++){
      if(lower[i]===s){ exact=i; break; }
      if(part<0 && lower[i].indexOf(s)>=0) part=i;
    }
    return exact>=0?exact:part;
  }

  function quizOpen(){
    QUIZ.on=true; QUIZ.done=false; QUIZ.chain=[]; QUIZ.best=null;
    $('#panel').hidden=true; $('#results').hidden=true;
    $('#quiz').hidden=false;
    quizSetup();
  }
  function quizClose(){
    QUIZ.on=false; $('#quiz').hidden=true;
    VIEW.path=[]; VIEW.selected=-1;
    renderPanel(CENTRE);
  }

  function quizSetup(){
    const nm=i=>i>=0?`${NET.names[i]} (${NET.firstSeason[i]}–${NET.lastSeason[i]})`:'';
    $('#quiz').innerHTML=
      `<h2>Test your knowledge</h2>
       <div class="lead">Two players. Join them with as short a chain of
         teammates as you can — every pair you name has to have shared a squad
         in the same season.</div>
       <div class="slot"><span class="tag">A</span>
         <input id="qa" placeholder="Anyone…" value="${QUIZ.a>=0?nm(QUIZ.a):''}">
         <button id="qad">Random</button></div>
       <div class="slot"><span class="tag">B</span>
         <input id="qb" placeholder="Anyone…" value="${QUIZ.b>=0?nm(QUIZ.b):''}">
         <button id="qbd">Random</button></div>
       <div id="qmsg" class="qerr" hidden></div>
       <button class="btn" id="qgo">Start</button>
       <button class="btn ghost" id="qx">Close</button>`;
    $('#qad').onclick=()=>{ QUIZ.a=randomPlayer(); quizSetup(); };
    $('#qbd').onclick=()=>{ QUIZ.b=randomPlayer(); quizSetup(); };
    $('#qgo').onclick=quizStart;
    $('#qx').onclick=quizClose;
  }

  function quizStart(){
    const a=$('#qa').value.trim()?findByName($('#qa').value):randomPlayer();
    const b=$('#qb').value.trim()?findByName($('#qb').value):randomPlayer();
    const say=t=>{ $('#qmsg').hidden=false; $('#qmsg').textContent=t; };
    if(a<0) return say('No player matches the first name.');
    if(b<0) return say('No player matches the second name.');
    if(a===b) return say('Pick two different players.');
    QUIZ.a=a; QUIZ.b=b;
    const r=NET.route(a,b);
    if(r.degrees<0) return say(`${NET.names[a]} and ${NET.names[b]} are not connected at all.`);
    QUIZ.best=r; QUIZ.chain=[a]; QUIZ.done=false; QUIZ.revealed=false;
    QUIZ.clue=null; QUIZ.clueLevel=0;
    // hang the round off player A, so the chain grows outward from him
    if(CENTRE!==a) recentreQuiet(a);
    quizRound();
  }

  // A step is legal only if it shared a team-season with the last one added.
  function quizAdd(i){
    const last=QUIZ.chain[QUIZ.chain.length-1];
    if(i===last) return 'That is the player you are already on.';
    if(QUIZ.chain.indexOf(i)>=0) return 'That player is already in your chain.';
    const sh=NET.sharedTeamSeasons(last,i);
    if(!sh.length) return `${NET.names[last]} and ${NET.names[i]} were never teammates.`;
    QUIZ.chain.push(i); QUIZ.clue=null; QUIZ.clueLevel=0;
    if(i===QUIZ.b) QUIZ.done=true;
    return null;
  }

  function quizRound(err){
    const steps=QUIZ.chain.length-1;
    const link=(u,v)=>{
      const sh=NET.sharedTeamSeasons(u,v);
      if(!sh.length) return '';
      const f=sh[0], more=sh.length>1?` +${sh.length-1}`:'';
      return `<li class="qstep via"><span class="chip">${f.team}</span> ${f.season}${more}</li>`;
    };
    const rows=QUIZ.chain.map((n,k)=>
      `<li class="qstep ${k===0?'fix':''}"><span class="dot"></span>${NET.names[n]}</li>`
      +(k<QUIZ.chain.length-1?link(n,QUIZ.chain[k+1]):'')).join('');
    // The box to type in sits between the chain and the target, so what you
    // are being asked to bridge is the gap you can see.
    const gap=QUIZ.done?'':
      `<li class="qstep gap"><input id="qnext" placeholder="Next teammate…" autocomplete="off">
         <div id="quizRes" hidden></div>
         ${QUIZ.clue?`<div class="qclue">${QUIZ.clue}</div>`:''}</li>`;
    const target=QUIZ.done?'':
      `<li class="qstep fix"><span class="dot"></span>${NET.names[QUIZ.b]}</li>`;
    $('#quiz').innerHTML=
      `<h2>Test your knowledge</h2>
       <div class="lead">Get from <b>${NET.names[QUIZ.a]}</b> to
         <b>${NET.names[QUIZ.b]}</b>. Name whoever links them, one at a time.</div>
       <ul class="qchain">${rows}${gap}${target}</ul>
       ${err?`<div class="qerr">${err}</div>`:''}
       ${QUIZ.done?quizVerdict():''}
       <div style="color:var(--grey);font-size:11px;margin-top:9px">
         ${steps} step${steps===1?'':'s'} so far</div>
       ${QUIZ.done?'':
         `<button class="btn ghost" id="qclue">${QUIZ.clueLevel?'Another clue':'Clue'}</button>
          <button class="btn ghost" id="qgive">Show the shortest route</button>`}
       <button class="btn ghost" id="qagain">${QUIZ.done?'Another pair':'Give up and restart'}</button>`;
    if(!QUIZ.done){
      const inp=$('#qnext');
      inp.oninput=quizSuggest; inp.focus();
      $('#quizRes').onclick=e=>{
        const d=e.target.closest('[data-i]'); if(!d) return;
        const bad=quizAdd(+d.dataset.i);
        quizRound(bad);
      };
      $('#qclue').onclick=quizClue;
      $('#qgive').onclick=quizReveal;
    }
    const show=$('#qshow'); if(show) show.onclick=quizReveal;
    $('#qagain').onclick=()=>{ QUIZ.a=-1; QUIZ.b=-1; quizSetup(); };
    quizDraw();
  }

  /* A clue about the next player on a shortest route from wherever you have
   * got to -- recomputed each time, so it stays useful after you have wandered
   * off the route the chart happened to draw. Club first, then the season. */
  function quizClue(){
    const last=QUIZ.chain[QUIZ.chain.length-1];
    const r=NET.route(last,QUIZ.b);
    const next=r.path[r.path.length-2];        // path runs b -> ... -> last
    if(next==null){ QUIZ.clue='No route left from here.'; return quizRound(); }
    const sh=NET.sharedTeamSeasons(last,next);
    if(!sh.length){ QUIZ.clue='No clue available.'; return quizRound(); }
    QUIZ.clueLevel=Math.min(2,(QUIZ.clueLevel||0)+1);
    const f=sh[0];
    const nm=(NET.tables.teamMeta[f.team]||{}).name||f.team;
    QUIZ.clue=QUIZ.clueLevel===1
      ? `Someone who played for <b>${nm}</b> with ${NET.names[last]}.`
      : `Someone who played for <b>${nm}</b> with ${NET.names[last]}, in <b>${f.season}</b>.`;
    quizRound();
  }

  function quizSuggest(){
    const q=$('#qnext').value.trim().toLowerCase();
    const box=$('#quizRes');
    if(q.length<2){ box.hidden=true; return; }
    const out=[];
    for(let i=0;i<NET.P && out.length<25;i++) if(lower[i].indexOf(q)>=0) out.push(i);
    box.hidden=false;
    box.innerHTML=out.length?out.map(i=>
      `<div data-i="${i}">${NET.names[i]} <span style="color:var(--grey)">${NET.firstSeason[i]}–${NET.lastSeason[i]}</span></div>`
    ).join(''):'<div style="color:var(--grey)">No players match</div>';
  }

  function quizVerdict(){
    const yours=QUIZ.chain.length-1, best=QUIZ.best.degrees;
    if(QUIZ.revealed) return `<div class="qdone">The shortest route is
      <b>${best} steps</b>. It is drawn on the chart.</div>`;
    if(yours===best) return `<div class="qdone"><b>${yours} steps.</b> That is the
      shortest there is — nobody links them faster.</div>`;
    return `<div class="qdone"><b>${yours} steps.</b> Linked, but it can be done
      in ${best}. <span id="qshow" style="color:var(--amber);cursor:pointer;
      text-decoration:underline">Show me</span></div>`;
  }

  function quizReveal(){
    QUIZ.chain=QUIZ.best.path.slice().reverse();   // route returns b -> a
    QUIZ.done=true; QUIZ.revealed=true;
    quizRound();
  }

  // draw the chain the user has built, so the graph follows along
  function quizDraw(){
    VIEW.selected=-1;          // nothing is "picked" here, so no gold ring
    VIEW.path=QUIZ.chain.length>1?QUIZ.chain.slice():[];
  }

  document.getElementById('quizBtn').onclick=()=>QUIZ.on?quizClose():quizOpen();
  document.getElementById('ring').onclick=()=>setRing(!VIEW.ringMode);
  document.getElementById('zin').onclick=()=>VIEW.zoomBy(1.35);
  document.getElementById('zout').onclick=()=>VIEW.zoomBy(1/1.35);
  document.getElementById('zfit').onclick=()=>VIEW.fit();
  $('#q').addEventListener('input',search);
  club.addEventListener('change',()=>{ fillSeasons(club.value); search(); });
  season.addEventListener('change',search);
  $('#results').addEventListener('click',e=>{
    const d=e.target.closest('[data-i]'); if(!d)return;
    $('#results').hidden=true; renderPanel(+d.dataset.i);
  });

  // fps readout
  let last=performance.now(), frames=0;
  setInterval(()=>{
    const now=performance.now(), f=VIEW.perf.frames-frames;
    const el=document.getElementById('fps');
    if(el) el.textContent=`${(f*1000/(now-last)).toFixed(0)} fps · draw ${VIEW.perf.draw.toFixed(1)} ms `+
      `(edges ${VIEW.perf.edges.toFixed(1)} / nodes ${VIEW.perf.nodes.toFixed(1)})`;
    last=now; frames=VIEW.perf.frames;
  },500);
})();
</script>
</body>
</html>
