<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The NFL teammate network — Sportalytic</title>
<meta name="description" content="Every NFL player since 1920, linked by shared team-seasons. Click anyone to see their path to the centre, or make them the centre.">
<link rel="icon" href="assets/logo.png">
<style>
@font-face{font-family:"Archivo Black";src:url("assets/ArchivoBlack.woff2") format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#0B1117;--panel:#141C25;--ink:#FFFFFF;--amber:#FBC247;--blue:#4E7FA8;
  --grey:#6C7A88;--greyd:#39454F;--maxw:1240px;
  --display:"Archivo Black","Arial Black",Arial,sans-serif;
  --body:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden}
a{color:inherit}
header{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(11,17,23,.8);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07)}
.bar{max-width:var(--maxw);margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:20px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand img{width:26px;height:26px}
.brand span{font-family:var(--display);font-size:15px;text-transform:uppercase}
nav a{text-decoration:none;font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--grey)}
#stage{position:fixed;inset:60px 0 0 0}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap;max-width:min(560px,calc(100% - 24px))}
.hud input,.hud select{background:var(--panel);color:var(--ink);border:1px solid var(--greyd);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px}
.hud input{min-width:200px}
#club{max-width:250px}
.hud select{max-width:250px}
#results{position:absolute;top:56px;left:12px;background:var(--panel);border:1px solid var(--greyd);border-radius:10px;max-height:46vh;overflow:auto;min-width:260px;z-index:5}
#results div{padding:8px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05)}
#results div:hover{background:#1d2833}
#panel{position:absolute;right:12px;top:12px;width:296px;background:var(--panel);border:1px solid var(--greyd);border-radius:12px;padding:16px;font-size:14px}
#panel h2{font-family:var(--display);font-size:19px;margin:0 0 2px;text-transform:uppercase;line-height:1.1}
#panel .meta{color:var(--grey);font-size:13px;margin-bottom:12px}
#panel .deg{color:var(--amber);font-weight:bold}
.chain{margin:10px 0 0;padding:0;list-style:none;max-height:34vh;overflow:auto}
.chain li{padding:4px 0;font-size:13px;border-left:2px solid var(--greyd);padding-left:10px;margin-left:3px}
.chain li.end{border-left-color:var(--amber)}
.btn{display:inline-block;margin-top:12px;background:var(--amber);color:#0B1117;border:0;border-radius:8px;padding:9px 13px;font:inherit;font-weight:bold;font-size:13px;cursor:pointer;width:100%}
#tools{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.tbtn{background:var(--panel);color:var(--ink);border:1px solid var(--greyd);border-radius:8px;
  padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;min-width:40px}
.tbtn:hover{border-color:var(--amber);color:var(--amber)}
.tbtn.on{background:var(--amber);color:#0B1117;border-color:var(--amber);font-weight:bold}
.via{color:var(--grey);font-size:11px;margin:1px 0 3px 13px;display:flex;align-items:center;gap:5px}
.chip{display:inline-block;background:#1d2833;border:1px solid var(--greyd);border-radius:4px;
  padding:1px 5px;font-size:10px;letter-spacing:.04em;color:#9CC2DC;font-weight:bold}
#stats{position:absolute;left:12px;bottom:12px;color:var(--grey);font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--grey);font-size:15px}
@media(max-width:820px){
  #panel{right:8px;left:8px;top:auto;bottom:8px;width:auto}
  .hud{max-width:calc(100% - 16px)}
  .hud input{min-width:0;flex:1}
}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="index.html"><img src="assets/logo.png" alt=""><span>Sportalytic</span></a>
  <nav><a href="index.html">Home</a> &nbsp; <a href="index.html#/reels">Our work</a></nav>
</div></header>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="loading">Loading the network…</div>
  <div class="hud">
    <input id="q" placeholder="Search a player…" autocomplete="off">
    <select id="club"><option value="">Any club</option></select>
    <select id="season"><option value="">Any season</option></select>
  </div>
  <div id="results" hidden></div>
  <div id="tools">
    <button class="tbtn" id="ring" title="Show the centre's direct team-mates grouped by club">First ring</button>
    <button class="tbtn" id="zin" title="Zoom in">+</button>
    <button class="tbtn" id="zout" title="Zoom out">&minus;</button>
    <button class="tbtn" id="zfit" title="Fit to screen">Fit</button>
  </div>
  <div id="panel" hidden></div>
  <div id="stats"></div>
</div>

<script src="assets/net/app.js"></script>
<script src="assets/net/view.js"></script>
<script>
const $=s=>document.querySelector(s);
let CENTRE=0;

function renderPanel(i){
  const d=NET.info(i), p=NET.pathToCentre(i);
  const c=NET.info(CENTRE);
  $('#panel').hidden=false;
  $('#panel').innerHTML=
    `<h2>${d.name}</h2>
     <div class="meta">${d.position||'—'} · ${d.first}–${d.last}</div>
     ${i===CENTRE?`<div class="deg">This is the centre</div>`
       :`<div><span class="deg">${d.degree}°</span> from ${c.name}</div>
          <ul class="chain">${p.map((n,k)=>{
            let row=`<li class="${k===p.length-1?'end':''}">${NET.names[n]}</li>`;
            if(k<p.length-1){
              // how these two are actually linked: the club and year they shared
              const sh=NET.sharedTeamSeasons(n,p[k+1]);
              if(sh.length){
                const f=sh[0], more=sh.length>1?` +${sh.length-1} more`:'';
                const full=sh.map(x=>`${x.team} ${x.season}`).join(', ');
                row+=`<div class="via" title="${full}">↳ <span class="chip">${f.team}</span> ${f.season}${more}</div>`;
              }
            }
            return row;}).join('')}</ul>`}
     <button class="btn" id="rec">Centre the chart on ${d.name}</button>`;
  $('#rec').onclick=()=>recentre(i);
  VIEW.selected=i; VIEW.path=i===CENTRE?[]:p;
}

const FACES={};   // player id -> portrait; only Kelce for now
function applyCentreImage(){ VIEW.setCentreImage(FACES[CENTRE]||null); }

function recentre(i){
  VIEW.captureFrom();
  const r=NET.recentre(i);
  CENTRE=i; VIEW.centre=i; VIEW.path=[]; VIEW.selected=i;
  setRing(false);
  VIEW.beginMorph(950);
  applyCentreImage();
  stats(r);
  renderPanel(i);
}

/* First-ring view: the centre's direct team-mates, grouped into a wedge per
 * club. Toggling back off just recomputes the full layout. */
function setRing(on){
  const btn=document.getElementById('ring');
  if(on){
    VIEW.captureFrom();
    const segs=NET.ringLayout(CENTRE);
    VIEW.setRingSegments(segs);
    VIEW.beginMorph(800);
    btn.classList.add('on');
  }else{
    if(!VIEW.ringMode){ btn.classList.remove('on'); return; }
    VIEW.captureFrom();
    NET.recentre(CENTRE);
    VIEW.setRingSegments(null);
    VIEW.beginMorph(800);
    btn.classList.remove('on');
  }
}

function stats(r){
  $('#stats').innerHTML=
    `${NET.P.toLocaleString()} players · centred on ${NET.names[CENTRE]} · `+
    `${r.ecc} degrees deep<br>`+
    `recentre ${(r.bfsMs+r.layoutMs).toFixed(1)} ms `+
    `(bfs ${r.bfsMs.toFixed(1)} + layout ${r.layoutMs.toFixed(1)}) · `+
    `<span id="fps"></span>`;
}

(async()=>{
  const meta=await NET.load('assets/net');
  $('#loading').remove();
  const t=NET.tables;
  const club=$('#club'), season=$('#season');
  t.teams.slice().sort((a,b)=>{
    const ma=t.teamMeta[a]||{}, mb=t.teamMeta[b]||{};
    if(!!ma.name!==!!mb.name) return ma.name?-1:1;         // named clubs first
    return (ma.name||a).localeCompare(mb.name||b);
  }).forEach(code=>{
    const m=t.teamMeta[code]||{};
    const label=m.name?`${m.name} (${code})`:`${code} · ${m.from}\u2013${m.to}`;
    club.add(new Option(`${label} — ${m.players||0} players`, code));
  });
  for(let y=t.seasonMax;y>=t.seasonMin;y--) season.add(new Option(y,y));

  CENTRE=(t.notable&&t.notable['Travis Kelce'])||0;
  const r=NET.recentre(CENTRE);
  VIEW.init($('#cv'), i=>renderPanel(i));
  FACES[CENTRE]='assets/net/face-kelce.png';   // the only portrait we have so far
  VIEW.centre=CENTRE; VIEW.fit(); VIEW.buildGrid(); VIEW.tick();
  applyCentreImage();
  stats(r);
  console.log('load',meta.ms.toFixed(0)+'ms', 'recentre',(r.bfsMs+r.layoutMs).toFixed(1)+'ms');

  // ---- search + club/season filter ----
  const lower=NET.names.map(s=>s.toLowerCase());
  function rosterOf(team,yr){
    const set=new Set();
    for(let ts=0;ts<NET.tsSeason.length;ts++){
      if(team && t.teams[NET.tsTeam[ts]]!==team) continue;
      if(yr && NET.tsSeason[ts]!==+yr) continue;
      for(let j=NET.t_ip[ts];j<NET.t_ip[ts+1];j++) set.add(NET.t_ix[j]);
    }
    return set;
  }
  function search(){
    const q=$('#q').value.trim().toLowerCase();
    const team=club.value, yr=season.value;
    if(!q && !team && !yr){ $('#results').hidden=true; return; }
    const pool=(team||yr)?rosterOf(team,yr):null;
    const out=[];
    for(let i=0;i<NET.P && out.length<60;i++){
      if(pool && !pool.has(i)) continue;
      if(q && lower[i].indexOf(q)<0) continue;
      out.push(i);
    }
    $('#results').hidden=false;
    $('#results').innerHTML=out.length?out.map(i=>
      `<div data-i="${i}">${NET.names[i]} <span style="color:var(--grey)">${NET.firstSeason[i]}–${NET.lastSeason[i]}</span></div>`
    ).join(''):'<div style="color:var(--grey)">No players match</div>';
  }
  document.getElementById('ring').onclick=()=>setRing(!VIEW.ringMode);
  document.getElementById('zin').onclick=()=>VIEW.zoomBy(1.35);
  document.getElementById('zout').onclick=()=>VIEW.zoomBy(1/1.35);
  document.getElementById('zfit').onclick=()=>VIEW.fit();
  $('#q').addEventListener('input',search);
  club.addEventListener('change',search); season.addEventListener('change',search);
  $('#results').addEventListener('click',e=>{
    const d=e.target.closest('[data-i]'); if(!d)return;
    $('#results').hidden=true; renderPanel(+d.dataset.i);
  });

  // fps readout
  let last=performance.now(), frames=0;
  setInterval(()=>{
    const now=performance.now(), f=VIEW.perf.frames-frames;
    const el=document.getElementById('fps');
    if(el) el.textContent=`${(f*1000/(now-last)).toFixed(0)} fps · draw ${VIEW.perf.draw.toFixed(1)} ms `+
      `(edges ${VIEW.perf.edges.toFixed(1)} / nodes ${VIEW.perf.nodes.toFixed(1)})`;
    last=now; frames=VIEW.perf.frames;
  },500);
})();
</script>
</body>
</html>
